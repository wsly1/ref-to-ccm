fluid:
  name: R454C

saturation:
  # type: pressure | temperature
  type: pressure
  value: 0.8
  unit: MPa

gas_table:
  # pressure 留空时使用饱和压力
  pressure:
  pressure_unit: MPa
  # mode: temperature | equivalent_quality
  mode: temperature
  temperature_start: 30
  temperature_end: 120
  temperature_step: 0.1
  temperature_unit: C
  # equivalent_quality 模式会保留温度范围和步长，泡点到露点之间用 RefEquiv 等效数据替代
  # quality_points 可填 auto 或整数；auto 表示按替代温度点数量自动决定
  quality_points: auto
  viscosity_model: cicchitti
  # specific_heat_source: cp_table | enthalpy_table
  specific_heat_source: cp_table

liquid_table:
  # mode: saturation | table
  mode: saturation
  temperature_start: 0
  temperature_end: 9
  temperature_step: 0.1
  temperature_unit: C

starccm:
  sim_file: E:\case\input.sim
  output_sim_file: E:\case\input_refprop.sim
  # 必须填写目标 .sim 中已经存在的连续体名称
  continuum_name: R454C
  liquid_phase_name: liquid
  vapor_phase_name: gas
  starccm_exe: E:\Program Files\STAR-CCM_202602\starccm_2026\21.02.007-R8\STAR-CCM+21.02.007-R8\star\lib\win64\clang20.1vc14.2-r8\lib\starccm+.exe

output:
  directory: .\out
